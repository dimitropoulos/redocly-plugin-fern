openapi: 3.1.0
info:
  title: Aliases
  version: 1.0.0
paths: {}
components:
  schemas:
    Name:
      description: A name.
      allOf:
        - $ref: "#/components/schemas/NameString"
    NameString:
      type: string
    Child:
      type: object
      properties:
        name:
          type: string
      allOf:
        - $ref: "#/components/schemas/AliasOfBase"
        - $ref: "#/components/schemas/AllOfAliasOfBase"
        - $ref: "#/components/schemas/ComposedBase"
    Base:
      type: object
      properties:
        id:
          type: string
    AliasOfBase:
      $ref: "#/components/schemas/Base"
    AllOfAliasOfBase:
      allOf:
        - $ref: "#/components/schemas/Base"
    ComposedBase:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
