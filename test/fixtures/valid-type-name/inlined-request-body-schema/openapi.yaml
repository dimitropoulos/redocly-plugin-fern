openapi: 3.1.0
info:
  title: Plant Store
  version: 1.0.0
paths:
  /plants:
    post:
      operationId: createPlant
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/10000Plants"
      responses:
        "204":
          description: Created.
components:
  schemas:
    10000Plants:
      type: object
      properties:
        names:
          type: array
          items:
            type: string
